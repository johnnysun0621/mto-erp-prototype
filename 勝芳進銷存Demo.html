<title>勝芳進銷存 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F1F0EA; --surface:#FBFAF6; --surface-2:#E9E8E1; --surface-3:#F5F4EF;
  --line:#D8D7CE; --line-strong:#BCBBB0;
  --ink:#1E2422; --ink-2:#5A625F; --ink-3:#8A918C;
  --accent:#0F6E6E; --accent-ink:#0B5252; --accent-soft:#DCEBEA;
  --kraft:#8A6A3A; --kraft-soft:#EFE6D6;
  --good:#3F7D3A; --good-soft:#E3EFDF;
  --warn:#A9700F; --warn-soft:#F7EBD4;
  --crit:#A63A2C; --crit-soft:#F6E1DD;
  --info:#3C5A94; --info-soft:#E2E9F6;
  --shadow:0 1px 2px rgba(30,36,34,.06), 0 8px 20px -14px rgba(30,36,34,.35);
  --r:4px;
  --sans:"IBM Plex Sans TC","IBM Plex Sans","Noto Sans TC","PingFang TC","微軟正黑體","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131714; --surface:#1A1F1C; --surface-2:#232925; --surface-3:#1F2521;
    --line:#2D3531; --line-strong:#465049;
    --ink:#E7EBE6; --ink-2:#A2ADA7; --ink-3:#77827C;
    --accent:#5AC1B6; --accent-ink:#8FDCD4; --accent-soft:#123330;
    --kraft:#C4A173; --kraft-soft:#2E2519;
    --good:#79C46B; --good-soft:#18301A;
    --warn:#DCA748; --warn-soft:#33270F;
    --crit:#E57865; --crit-soft:#371D18;
    --info:#87A8E2; --info-soft:#19233A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#131714; --surface:#1A1F1C; --surface-2:#232925; --surface-3:#1F2521;
  --line:#2D3531; --line-strong:#465049;
  --ink:#E7EBE6; --ink-2:#A2ADA7; --ink-3:#77827C;
  --accent:#5AC1B6; --accent-ink:#8FDCD4; --accent-soft:#123330;
  --kraft:#C4A173; --kraft-soft:#2E2519;
  --good:#79C46B; --good-soft:#18301A;
  --warn:#DCA748; --warn-soft:#33270F;
  --crit:#E57865; --crit-soft:#371D18;
  --info:#87A8E2; --info-soft:#19233A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
table{border-collapse:collapse;width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:15px;font-weight:600;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.14em;font-family:var(--mono);text-transform:uppercase}
.top .sp{flex:1}
.today{font-size:12px;color:var(--ink-2);font-family:var(--mono)}

.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;line-height:1.4;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .btn-primary,:root:not([data-theme="light"]) .btn-primary{color:#0A1614}
.btn-primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-sm{padding:3px 9px;font-size:12px}
.btn-icon{padding:5px 9px}

/* ---------- step pill (reused by delivery status tracker) ---------- */
.steps{display:flex;gap:2px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:999px;font-size:12px;color:var(--ink-3);background:transparent;border:1px solid transparent;white-space:nowrap}
.step .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-size:10px;flex:none}
.step.done{color:var(--ink-2)}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.now{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.step.now .n{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- body ---------- */
.body{flex:1;display:grid;grid-template-columns:224px minmax(0,1fr);align-items:start}
.rail{position:sticky;top:47px;background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--line)}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);border:none;background:none;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13.5px;width:100%}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.navitem .g{width:18px;text-align:center;color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.navitem[aria-current="true"] .g{color:var(--accent)}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.rail hr{border:none;border-top:1px solid var(--line);margin:8px 4px}
.rail .foot{padding:6px 10px;font-size:11px;color:var(--ink-3);line-height:1.5}

.main{padding:22px 24px 60px;min-width:0}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap;position:sticky;top:47px;z-index:15;background:var(--paper);padding-bottom:10px}
.phead h1{font-size:20px}
.phead .sub{font-size:12.5px;color:var(--ink-2);padding-bottom:2px}
.phead .sp{flex:1}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono);margin-bottom:3px}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono);margin-bottom:4px}
.crumb .sep{color:var(--line-strong);letter-spacing:0}
.crumb .cur{color:var(--ink-2)}

/* ---------- blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>h3{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:8px}
.card>h3 .sp{flex:1}
.card .pad{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:16px}
.kpi{padding:12px 14px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi .l{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:3px}
.kpi.alert .v{color:var(--crit)}
.kpi.watch .v{color:var(--warn)}
button.kpi{display:block;width:100%;box-sizing:border-box;border:none;border-right:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .12s,border-color .12s}
button.kpi:hover{background:var(--surface-3);border-color:var(--ink-3)}
button.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;position:relative;z-index:1}

/* dashboard stat rows：庫存健康／例外事件 的可點聚合列 */
.statlist{display:flex;flex-direction:column}
.statrow{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:9px 14px;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.statlist>.statrow:last-child{border-bottom:none}
.statrow:hover{background:var(--surface-3)}
.statrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.statrow .lb{flex:1;font-size:13px;display:flex;align-items:center;gap:7px}
.statrow .ct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}
.statrow.z .ct,.statrow.z .lb{color:var(--ink-3)}
.statdiv{border-top:1px dashed var(--line);margin:2px 0}
.stathead{padding:9px 14px 2px;font-size:11px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}

/* 關聯單據：一份單據引出的下游文件清單，逐列列出「有 / 還沒有」，比橫向欄位表格更好掃描 */
.doclist{display:flex;flex-direction:column}
.docrow{display:flex;align-items:baseline;gap:14px;padding:9px 14px;border-bottom:1px solid var(--line)}
.doclist>.docrow:last-child{border-bottom:none}
.docrow .lb{flex:none;width:88px;font-size:12px;color:var(--ink-3)}
.docrow .val{flex:1;font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* tables */
.tw{overflow-x:auto}
.tbl{font-size:13px;min-width:100%}
.tbl th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;position:sticky;top:0;background:var(--surface);z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-3)}
.tbl tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.tbl .r{text-align:right}
.tbl .flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.tbl td small{color:var(--ink-3);font-size:11.5px}

/* table toolbar + pagination (Prototype: client-side query pipeline) */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-3)}
.tbar input[type="search"],.tbar select{font:inherit;font-size:12.5px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.tbar input[type="search"]{min-width:180px;flex:1;max-width:300px}
.tbar .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.tbar .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl th.s{cursor:pointer;user-select:none}
.tbl th.s:hover{color:var(--ink-2)}
.tbl th .ar{font-size:9px;margin-left:3px;color:var(--accent)}
.tfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-3);font-size:12px;color:var(--ink-2)}
.tfoot .pg{display:flex;gap:2px;align-items:center;margin-left:auto}
.pgb{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:2px 8px;border-radius:var(--r);cursor:pointer;font-size:12px;font-family:var(--mono);min-width:28px}
.pgb:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.pgb:disabled{opacity:.4;cursor:not-allowed}
.pgb[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .pgb[aria-current="true"],:root:not([data-theme="light"]) .pgb[aria-current="true"]{color:#0A1614}
.pgs{padding:0 4px;color:var(--ink-3)}
.tfoot select{font:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}

/* prototype / hypothesis markers */
.hyp{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;line-height:1.6;color:var(--ink-3);border:1px dashed var(--line-strong);border-radius:3px;padding:0 5px;white-space:nowrap;cursor:help;vertical-align:1px}
.hyp::before{content:"?";font-family:var(--mono);font-size:9px;opacity:.7}
.proto{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:3px;padding:2px 8px;white-space:nowrap;cursor:help}
.proto b{font-weight:600;color:var(--ink)}
.hnote{font-size:11.5px;color:var(--ink-3);padding:8px 14px;border-top:1px dashed var(--line);line-height:1.6}

/* supply recommendation panel */
.rec{border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.rec>h4{padding:9px 13px;font-size:12.5px;border-bottom:1px solid var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.rec .recbody{background:var(--surface);padding:0}
.alloc{display:inline-flex;gap:4px;flex-wrap:wrap}
.planedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.planqty{display:inline-flex;align-items:center;gap:5px;font-size:11.5px}
.planqty label{color:var(--ink-3)}
.planqty input{width:64px;text-align:right;font-family:var(--mono);font-size:12.5px;padding:3px 5px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
.planqty.g input{border-color:var(--good)}
.planqty.k input{border-color:var(--kraft)}
.planqty.i input{border-color:var(--info)}

/* chips & badges */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;white-space:nowrap;border:1px solid transparent}
.bdg::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.bdg.n{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.bdg.a{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.bdg.g{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.bdg.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.bdg.c{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.bdg.i{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.bdg.k{background:var(--kraft-soft);color:var(--kraft);border-color:var(--kraft)}
.bdg.sq{border-radius:3px}
.bdg.sq::before{display:none}
.doc{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);background:none;border:none;padding:0;cursor:pointer;border-bottom:1px dotted var(--accent);}
.doc:hover{color:var(--accent);border-bottom-style:solid}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}

/* stock figure group */
.qtys{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.qty{flex:1;padding:9px 12px;border-right:1px solid var(--line);min-width:88px}
.qty:last-child{border-right:none}
.qty .l{font-size:11px;color:var(--ink-3)}
.qty .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.qty.hi .v{color:var(--accent-ink);font-weight:500}
.qty.res .v{color:var(--warn)}
.qty.inc .v{color:var(--info)}


/* exception list */
.exc{display:flex;flex-direction:column}
.exc>div{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.exc>div:last-child{border-bottom:none}
.exc .t{flex:1;min-width:0}
.exc .t b{font-weight:500}
.exc .t p{font-size:12px;color:var(--ink-2);margin-top:1px}

/* detail panels */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.dl>div .l{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.dl>div .v{font-size:13.5px}
/* 主檔可編輯欄位：直接借用 .dl 的標籤／值排版，值換成 input/select 就變成可編輯表單，
   跟其他頁面唯讀的 .dl 視覺語言一致，不用另外學一套介面。 */
.dl>div .v input,.dl>div .v select{width:100%;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
/* 主/從（Master-Detail）雙欄：欄框固定在視窗內，資料多時欄內自行 scroll，
   不讓整頁跟著資料筆數往下長（避免切換清單項目時視窗跳動）。 */
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px;height:calc(100dvh - 240px);min-height:420px}
.split>.card{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.split>.card>.tw{flex:1;min-height:0;overflow-y:auto}
.split>div{height:100%;min-height:0;overflow-y:auto}
@media (max-width:1080px){
  .split{grid-template-columns:1fr;height:auto;min-height:0}
  .split>.card{height:auto;overflow:visible}
  .split>.card>.tw{overflow-y:visible}
  .split>div{height:auto;overflow-y:visible}
}
.actbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-3);align-items:center}
.actbar .note{font-size:12px;color:var(--ink-2)}

/* form */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--ink-2)}
.field input,.field select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:none;background:none;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* chain */
.chain{display:flex;flex-direction:column;gap:0}
.node{border:1px solid var(--line);border-left:3px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px 13px}
.node.a{border-left-color:var(--accent)} .node.k{border-left-color:var(--kraft)}
.node.i{border-left-color:var(--info)} .node.g{border-left-color:var(--good)}
.node .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.node .h b{font-family:var(--mono);font-size:13px;font-weight:500}
.node .d{font-size:12px;color:var(--ink-2);margin-top:3px}
.link{height:14px;width:1px;background:var(--line-strong);margin-left:22px}
.branch{margin-left:22px;padding-left:16px;border-left:1px solid var(--line-strong);display:flex;flex-direction:column;gap:0}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;box-shadow:var(--shadow);z-index:60;display:flex;align-items:center;gap:12px;font-size:13px;max-width:min(560px,92vw)}
.toast button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;text-decoration:underline;white-space:nowrap}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong)}
.modal{position:fixed;inset:0;background:rgba(20,24,22,.5);z-index:70;display:grid;place-items:center;padding:20px}
.sheet{background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);max-width:760px;width:100%;max-height:86vh;overflow:auto}

/* =====================================================================
   勝芳紙業進銷存 — 需求訪談 Prototype

   Prototype Architecture Only：
     Browser → JavaScript Array → Search / Filter / Sort / Pagination → DOM
   全部資料在瀏覽器記憶體，無後端、無資料庫、無 build。

   正式 Production Architecture 應為：
     Browser → API → Application Service → Database
   並採 server-side pagination / filtering / sorting：
     SELECT ... FROM ... WHERE ... ORDER BY ... LIMIT ... （或 cursor pagination）
   正式系統禁止 download all records 後在瀏覽器過濾。

   不可破壞的架構約束：
     Inventory Ledger 是庫存唯一真相。所有庫存數量都由 Ledger 事件推導，
     沒有任何 item.qty 欄位可以直接改寫（見 post() / agg()）。

function md(s){return s?s.slice(5):"";}
function n0(v){return Number(v).toLocaleString("zh-TW",{maximumFractionDigits:0});}
function n1(v){return Number(v).toLocaleString("zh-TW",{minimumFractionDigits:1,maximumFractionDigits:1});}
function q(v){var n=Number(v);return Math.abs(n-Math.round(n))<1e-9?n0(n):n.toLocaleString("zh-TW",{minimumFractionDigits:3,maximumFractionDigits:3});}
function money(v){return "NT$"+n0(v);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

/* ====================== 推導（庫存總帳為唯一真相） ====================== */
/* 主檔索引（大量資料時避免每次線性搜尋） */
var _idx=null,_idxKey="";
function idx(){
  var key=DB.token+":"+DB.items.length+":"+DB.customers.length+":"+DB.suppliers.length;
  if(_idx&&_idxKey===key)return _idx;
  var m={it:{},cu:{},su:{},wh:{}};
  DB.items.forEach(function(x){m.it[x.code]=x;});
  DB.customers.forEach(function(x){m.cu[x.code]=x;});
  DB.suppliers.forEach(function(x){m.su[x.code]=x;});
  DB.warehouses.forEach(function(x){m.wh[x.code]=x;});
  _idx=m;_idxKey=key;return m;
}
function item(c){return idx().it[c]||null;}
function cust(c){return idx().cu[c]||null;}
function supp(c){return idx().su[c]||null;}
/* 品項主檔上的 mill 只記供應商「名稱」（不是代碼），這裡統一查回完整供應商資料，
   供應建議、手動調整、確認供應方案、手動開採購單共用同一個查法。 */
function supForItem(c){var it=item(c);return it&&it.mill?DB.suppliers.filter(function(s){return s.name===it.mill;})[0]||null:null;}
function whName(c){var w=idx().wh[c];return w?w.name:c;}
function custName(c){var x=idx().cu[c];return x?x.name:c;}
function supName(c){var x=idx().su[c];return x?x.name:c;}
/* 庫存聚合索引：只是把 Ledger 事件加總起來的快取，Ledger 仍是唯一真相。
   任何寫入資料的動作都會 DB.rev++，快取即失效重算。畫面上沒有任何可直接改寫的庫存欄位。 */
var _agg=null,_aggKey="";
function agg(){
  var key=DB.token+":"+DB.rev;
  if(_agg&&_aggKey===key)return _agg;
  var a={oh:{},res:{},inc:{}};
  DB.ledger.forEach(function(l){
    a.oh[l.item]=(a.oh[l.item]||0)+l.qty;
    var k=l.item+"|"+l.wh; a.oh[k]=(a.oh[k]||0)+l.qty;
  });
  DB.reservations.forEach(function(r){
    if(r.status!=="open")return;
    a.res[r.item]=(a.res[r.item]||0)+r.qty;
    var k=r.item+"|"+r.wh; a.res[k]=(a.res[k]||0)+r.qty;
  });
  DB.pos.forEach(function(po){
    if(po.status==="已入庫"||po.status==="已取消")return;
    po.lines.forEach(function(l){a.inc[l.item]=(a.inc[l.item]||0)+(l.qty-l.recv);});
  });
  _agg=a;_aggKey=key;return a;
}
function rnd3(n){return Math.round(n*1000)/1000;}
function onHand(it,wh){return rnd3(agg().oh[wh?it+"|"+wh:it]||0);}
function reserved(it,wh){return rnd3(agg().res[wh?it+"|"+wh:it]||0);}
function available(it,wh){return rnd3(onHand(it,wh)-reserved(it,wh));}
function incoming(it){return rnd3(agg().inc[it]||0);}
/* 庫存有異動的 品項×倉別 組合（供庫存狀態表使用，避免掃描 品項 × 倉別 全笛卡兒積） */
function stockPairs(){
  var seen={},out=[];
  Object.keys(agg().oh).forEach(function(k){
    if(k.indexOf("|")<0||seen[k])return;
    seen[k]=1;
    if(Math.abs(agg().oh[k])<1e-9)return;
    var p=k.split("|");
    if(!item(p[0]))return;
    out.push({item:p[0],wh:p[1]});
  });
  return out;
}
function p3(n){return n<10?"00"+n:(n<100?"0"+n:""+n);}
function nextNo(kind){
  DB.seq[kind]++;
  var pre={qt:"QT",so:"SO",po:"PO",cv:"CV",dn:"DN",iv:"IV",sc:"SC"}[kind];
  return pre+"-2609-"+p3(DB.seq[kind]);
}
/* 客戶專屬價格：有議定價用議定價，否則用標準牌價 */
function priceFor(custCode,itemCode){
  var c=cust(custCode);
  var list=item(itemCode).price;
  var own=c&&c.prices?c.prices[itemCode]:null;
  return {price:own||list,list:list,custom:!!own};
}
/* 輸入單位換算回庫存單位 */
function toStock(itemCode,val,uom){
  var it=item(itemCode),f=1;
  it.uoms.forEach(function(u){if(u[0]===uom)f=u[1];});
  return Math.round(val/f*1000)/1000;
}
function findQT(no){return DB.quotes.filter(function(x){return x.no===no;})[0];}
function findSO(no){return DB.sos.filter(function(x){return x.no===no;})[0];}
function findPO(no){return DB.pos.filter(function(x){return x.no===no;})[0];}
function findCV(no){return DB.convs.filter(function(x){return x.no===no;})[0];}
function findDN(no){return DB.dns.filter(function(x){return x.no===no;})[0];}

/* 唯一的庫存寫入口。禁止任何地方直接改寫品項數量（不存在 item.qty 這種欄位）。 */
function post(date,it,wh,qty,event,ref,note,roll){
  DB.seq.lg++;DB.rev++;
  var row={id:"L"+p2(DB.seq.lg),date:date,item:it,wh:wh,qty:qty,event:event,ref:ref||"",note:note||"",roll:roll||""};
  DB.ledger.push(row);
  S.flash.push(row.id);
  return row;
}
/* 建立／消耗庫存保留（影響可用量，但不影響現有量） */
function reserve(so,line,itemCode,wh,qty){
  DB.seq.rs++;DB.rev++;
  var r={id:"RS-"+p2(DB.seq.rs),so:so,line:line,item:itemCode,wh:wh,qty:qty,status:"open"};
  DB.reservations.push(r);return r;
}

/* ====================== 大量資料模式 ======================
   Prototype Architecture Only：資料在瀏覽器記憶體中產生，用於驗證
   搜尋 / 篩選 / 排序 / 分頁 的操作方式，不是效能基準。
   正式系統這些資料應存放於資料庫，並以 server-side query 分頁取用。 */
var LARGE_DATASET_MODE=false;
var GRADES=["道林紙（非塗佈）","雙面銅版紙","單面銅版卡","工業用牛皮紙","模造紙","白版紙","牛皮卡紙","描圖紙"];

function generateDemoData(DB,cfg){

      nSO=cfg.sos||1000,nPO=cfg.pos||500,nLg=cfg.ledger||5000;
  var s=1;function rand(){s=(s*1103515245+12345)%2147483648;return s/2147483648;}
  function pick(a){return a[Math.floor(rand()*a.length)];}
  var gsms=[70,80,100,120,157,200,250,300],widths=[787,880,1092,1200,1560];

  for(var i=0;i<nSup;i++){
    var days=[5,7,10,14][Math.floor(rand()*4)];
    DB.suppliers.push({code:"S-3"+p3(i+1),name:"示範供應商 "+p3(i+1),lead:days+" 天",days:days,terms:"月結 45 天"});
  }
  for(i=0;i<nCust;i++)
    DB.customers.push({code:"C-2"+p3(i+1),name:"示範客戶 "+p3(i+1),terms:"月結 30 天",
      ship:"新北市示範區示範路 "+(i+1)+" 號",contact:"聯絡人 "+p3(i+1),prices:{},note:"適用標準牌價"});

  var genItems=[];

/* ---------- 供應配置（Fulfillment Allocation） ----------
   一筆需求可以同時由 現貨 + 裁切 + 採購 三種來源湊出來，不是三選一。
   本函式只計算、不寫任何資料。裁切前置 2 天、良率與剩料、供應商交期皆為 Demo 假設。 */
function convCapacity(itemCode,extraUsed){
  var it=item(itemCode);
  if(!it.parent)return {perRoll:0,cap:0,parent:null};
  var par=item(it.parent);
  var perRoll=Math.floor(par.kg*0.98/it.kg);
  /* 母捲可用量以履約倉（WH-BL）計算，不跨倉自動借用 */
  var rollsFree=Math.max(0,available(it.parent,FULFILL_WH)-(extraUsed||0));
  return {perRoll:perRoll,cap:rollsFree*perRoll,parent:par};
}
/* 銷售可承諾量一律以履約倉（八里主倉）計算：不使用公司全倉 Available，
   避免「看得到、承諾得了，但實際保留不出來」。其他倉庫庫存僅供參考顯示。 */
function planSupply(itemCode,qty,parentUsed){
  var it=item(itemCode),av=available(itemCode,FULFILL_WH);
  var stock=Math.min(qty,Math.max(0,av));
  var gap=rnd3(qty-stock);
  var cc=convCapacity(itemCode,parentUsed);
  var conversion=gap>0?Math.min(gap,cc.cap):0;
  var purchase=rnd3(gap-conversion);
  var sup=supForItem(itemCode);
  var lead=(sup?sup.days:7)+1;
  var days=purchase>0?lead:(conversion>0?2:0);
  var why=[];
  if(stock>0)why.push("現貨可保留 "+q(stock)+" "+it.uom);
  if(conversion>0)why.push("以母捲裁切補 "+q(conversion)+" "+it.uom+"（含排機約 2 天）");
  if(purchase>0)why.push("向 "+it.mill+" 採購 "+q(purchase)+" "+it.uom+"（交期 "+(sup?sup.days:7)+" 天）");
  var otherWh=rnd3(onHand(itemCode)-onHand(itemCode,FULFILL_WH));
  return {avail:av,qty:qty,stock:stock,conversion:conversion,purchase:purchase,
    rollsNeeded:conversion>0?Math.ceil(conversion*it.kg/(cc.parent.kg*0.96)):0,
    days:days,date:d(days),why:why.join("；")||"可用量足夠，備妥即可出貨",
    otherWh:otherWh,
    path:(purchase>0?"採購":(conversion>0?"裁切":"現貨"))};
}
/* 第一階段：只產生建議，不建立任何單據、不動庫存 */
function recommendSO(no){
  var so=findSO(no); if(!so||so.status!=="已確認")return;
  var parentUsed={};
  so.plan=so.lines.map(function(l){
    var it=item(l.item),pk=it.parent||"";
    var p=planSupply(l.item,l.qty,pk?(parentUsed[pk]||0):0);
    if(pk&&p.rollsNeeded)parentUsed[pk]=(parentUsed[pk]||0)+p.rollsNeeded;
    p.lineId=l.id;p.item=l.item;return p;
  });
  so.planAt=d(0);
  toast("已產生供應建議（僅為分析結果，尚未建立任何單據，也未動用庫存）。確認後才會保留庫存並開立工單／採購單。");
}
/* 第二階段：人工確認後才寫入 —— 保留、裁切工單、採購單 */
function confirmSO(no){
  var so=findSO(no); if(!so||!so.plan||so.status!=="已確認")return;
  var made=[];
  so.plan.forEach(function(p){
    var l=so.lines.filter(function(x){return x.id===p.lineId;})[0];
    l.fulfill={stock:p.stock,conversion:p.conversion,purchase:p.purchase};
    l.confirmedQty=rnd3(p.stock+p.conversion+p.purchase);
    l.confirmedDate=p.date;
    if(p.stock>0)reserve(so.no,l.id,l.item,FULFILL_WH,p.stock);
    if(p.conversion>0){
      var pit=item(l.item),par=item(pit.parent);
      var rolls=Math.max(1,Math.ceil(p.conversion*pit.kg/(par.kg*0.96)));
      var totKg=rolls*par.kg, remainKg=60;
      var outQty=Math.floor((totKg-remainKg)*0.98/pit.kg);
      var outKg=Math.round(outQty*pit.kg*10)/10;
      var scrapKg=Math.round((totKg-outKg-remainKg)*10)/10;
      var cv={no:nextNo("cv"),date:d(0),status:"已釋放",wh:"WH-CV",inItem:par.code,inQty:rolls,inKg:totKg,
        rolls:DB.rolls.filter(function(x){return x.item===par.code&&x.status==="在庫";}).slice(0,rolls).map(function(x){return x.no;}),
        outItem:l.item,outQty:outQty,outKg:outKg,remainKg:remainKg,remainRoll:"",scrapKg:scrapKg,
        yield:Math.round(outKg/totKg*1000)/10,so:so.no,soLine:l.id,need:p.conversion};
      DB.convs.push(cv);DB.rev++; l.conv=cv.no;
      made.push("裁切工單 "+cv.no+"（投入 "+rolls+" 捲母捲）");
    }
    if(p.purchase>0){
      var it2=item(l.item);
      var sup=supForItem(l.item)||DB.suppliers[0];
      var po={no:nextNo("po"),sup:sup.code,date:d(0),eta:d(sup.days),status:"已確認",so:so.no,soLine:l.id,
        lines:[{id:1,item:l.item,qty:p.purchase,recv:0,cost:Math.round(it2.price*0.86)}]};
      DB.pos.push(po);DB.rev++; l.po=po.no;
      made.push("採購單 "+po.no+"（"+q(p.purchase)+" "+it2.uom+"，"+sup.name+"）");
    }
  });
  so.status="已配置";DB.rev++;
  toast("供應方案已確認．已建立庫存保留"+(made.length?"、"+made.join("、"):"")+"。庫存要等裁切領料、採購入庫與出貨過帳才會異動。");
}

/* Demo 假設：貨物進入「已出車」時執行銷售出庫。正式庫存過帳時點待需求訪談確認。
   出庫只做庫存與訂單狀態，不自動開發票 —— 發票改由人工建立。 */
function postDN(dn){
  var so=findSO(dn.so),cnt=0;
  dn.lines.forEach(function(l){
    post(d(0),l.item,"WH-BL",-l.qty,"銷售出庫",dn.no,custName(dn.cust)+"　"+so.no);cnt++;
    /* 用 soLineId 對回明細，不靠 item code——同一 Item 在同張 SO 出現兩行也不會錯配 */
    var sl=so.lines.filter(function(x){return x.id===l.soLineId;})[0]; if(sl)sl.shipped=l.qty;
  });
  DB.reservations.forEach(function(r){if(r.so===so.no&&r.status==="open")r.status="consumed";});
  so.status="已出貨";dn.posted=true;DB.rev++;
  toast("出貨單 "+dn.no+" 已出車過帳｜訂單轉為「已出貨」，庫存保留已釋放．已寫入 "+cnt+" 筆庫存異動。發票尚未開立。",true);

function createInvoice(soNo){
  var so=findSO(soNo); if(!so||invoiceOf(soNo))return;
  var dn=DB.dns.filter(function(x){return x.so===soNo;})[0];

    .map(function(l){return {item:l.item,qty:l.shipped,price:l.price,amt:l.shipped*l.price};});
  if(!lines.length){toast("此訂單尚未出庫，沒有可開立發票的數量。");return;}
  var sub=lines.reduce(function(a,b){return a+b.amt;},0),tax=Math.round(sub*0.05);

  DB.invoices.push(iv);DB.rev++;

}

   回傳 true 表示確實找到該行並更新，false 表示查無此行（單號或行號不存在）。 */
function applyPlanEdit(soNo,lineId,field,rawValue){
  var soP=findSO(soNo),prow=soP&&soP.plan?soP.plan.filter(function(x){return x.lineId===lineId;})[0]:null;

  if(prow.purchase>0)why3.push("向 "+it3.mill+" 採購 "+q(prow.purchase)+" "+it3.uom+"（交期 "+(sup3?sup3.days:7)+" 天）");

   可按期交付／部分延後／延後可交／待確認，四選一，不假造日期。 */
function promiseStatus(f,reqDate,confDate){

   不改寫、也不取代 so.status（Order 生命週期欄位，Dashboard／其他模組仍依賴它）。 */
function fulfillmentStatusOf(so){
  if(so.status==="已出貨")return{label:"已出貨",cls:"g"};
  if(so.lines.some(function(l){return l.shipped>0;}))return{label:"部分出貨",cls:"w"};
  if(!so.lines.some(function(l){return l.fulfill;}))return{label:"待配置",cls:"n"};

    var rs=DB.reservations.filter(function(r){return r.so===so.no&&r.line===l.id&&r.status==="open";}).reduce(function(a,b){return a+b.qty;},0);
    return rs>=l.qty;

  return allReady?{label:"已備齊",cls:"a"}:{label:"部分備齊",cls:"w"};

/* ================= 通用資料表：搜尋 → 篩選 → 排序 → 分頁 → 只渲染當頁 =================
   Prototype Architecture Only：
     Browser → JavaScript Array → Filter / Sort / Pagination → DOM
   正式 Production Architecture 應為：
     Browser → API → Application Service → Database
   並採 server-side pagination / filtering / sorting（SELECT ... WHERE ... ORDER BY ... LIMIT ...
   或 cursor pagination）。正式系統禁止 download all records 後在瀏覽器過濾。 */
var PAGE_SIZES=[25,50,100],DEFAULT_PAGE_SIZE=50;
function tbl(key){
  if(!S.tbl[key])S.tbl[key]={q:"",f:{},sort:null,dir:"asc",page:1,size:DEFAULT_PAGE_SIZE};
  return S.tbl[key];
}
function dataTable(cfg){
  var st=tbl(cfg.key),rows=cfg.rows||[];
  /* 1. 搜尋 */
  var qs=st.q.trim().toLowerCase();
  if(qs&&cfg.search)rows=rows.filter(function(r){return String(cfg.search(r)||"").toLowerCase().indexOf(qs)>=0;});
  /* 2. 篩選 */
  (cfg.filters||[]).forEach(function(f){
    var v=st.f[f.k];
    if(v)rows=rows.filter(function(r){return f.match(r,v);});
  });
  /* 3. 排序 */
  var total=rows.length,col=null;
  if(st.sort){
    cfg.cols.forEach(function(c){if(c.k===st.sort&&c.sort)col=c;});
    if(col){
      rows=rows.slice().sort(function(a,b){
        var x=col.sort(a),y=col.sort(b);
        if(x===y)return 0;
        return (x>y?1:-1)*(st.dir==="desc"?-1:1);
      });
    }
  }else if(cfg.defaultSort)rows=cfg.defaultSort(rows.slice());
  /* 4. 分頁：只保留當頁資料 */
  var pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages)st.page=pages;
  var from=(st.page-1)*st.size,to=Math.min(total,from+st.size);
  var pageRows=rows.slice(from,to);

  /* 工具列 */
  var bar='',ctrls=[];
  if(cfg.search)ctrls.push('<input type="search" data-tq="'+cfg.key+'" value="'+esc(st.q)+'" placeholder="'+esc(cfg.placeholder||"搜尋")+'" aria-label="搜尋">');
  (cfg.filters||[]).forEach(function(f){
    ctrls.push('<label class="lbl">'+f.label+'</label><select data-tf="'+cfg.key+'|'+f.k+'">'+
      '<option value="">全部</option>'+
      f.options.map(function(o){
        var val=typeof o==="string"?o:o[0],lab=typeof o==="string"?o:o[1];
        return '<option value="'+esc(val)+'"'+(st.f[f.k]===val?' selected':'')+'>'+esc(lab)+'</option>';
      }).join("")+'</select>');
  });
  if(ctrls.length)bar='<div class="tbar">'+ctrls.join("")+'<span class="cnt">共 '+n0(total)+' 筆</span></div>';

  /* 表頭 */
  var head=cfg.cols.map(function(c){
    var cls=(c.r?"r ":"")+(c.sort?"s":"");
    var ar=st.sort===c.k?'<span class="ar">'+(st.dir==="asc"?"▲":"▼")+'</span>':'';
    return '<th class="'+cls+'"'+(c.sort?' data-ts="'+cfg.key+'|'+c.k+'"':'')+'>'+c.label+ar+'</th>';
  }).join("");

  /* 內容：只有當頁 rows 進入 DOM */
  var body=pageRows.map(function(r){
    var meta=cfg.onRow?cfg.onRow(r):null;
    var attrs=meta?' class="click'+(meta.flash?" flash":"")+'" data-act="'+meta.act+'" data-no="'+meta.no+'" aria-selected="'+(!!meta.selected)+'"':(cfg.rowClass?' class="'+cfg.rowClass(r)+'"':'');
    return '<tr'+attrs+'>'+cfg.cols.map(function(c){
      return '<td'+(c.r?' class="r"':'')+'>'+c.cell(r)+'</td>';
    }).join("")+'</tr>';
  }).join("");
  if(!pageRows.length)body='<tr><td colspan="'+cfg.cols.length+'" class="dim" style="padding:18px 12px">'+(cfg.empty||"沒有符合條件的資料")+'</td></tr>';

  /* 分頁 footer */
  var foot='';
  if(total>0){
    var nums=pageWindow(st.page,pages).map(function(p){
      if(p==="…")return '<span class="pgs">…</span>';
      return '<button class="pgb" data-tp="'+cfg.key+'|'+p+'" aria-current="'+(p===st.page)+'">'+p+'</button>';
    }).join("");
    foot='<div class="tfoot"><span>共 <b class="num">'+n0(total)+'</b> 筆 · 顯示 '+n0(from+1)+'–'+n0(to)+'</span>'+
      '<span class="pg">'+
        '<button class="pgb" data-tp="'+cfg.key+'|'+(st.page-1)+'"'+(st.page<=1?' disabled':'')+'>上一頁</button>'+nums+
        '<button class="pgb" data-tp="'+cfg.key+'|'+(st.page+1)+'"'+(st.page>=pages?' disabled':'')+'>下一頁</button>'+
        '<span class="lbl" style="margin-left:8px">每頁</span><select data-tz="'+cfg.key+'">'+
          PAGE_SIZES.map(function(s){return '<option value="'+s+'"'+(st.size===s?' selected':'')+'>'+s+'</option>';}).join("")+
        '</select>'+
      '</span></div>';
  }
  return bar+'<div class="tw"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+foot;
}
/* 頁碼視窗化：1 … 4 5 6 … 250 */
function pageWindow(cur,pages){
  var out=[],i;
  if(pages<=7){for(i=1;i<=pages;i++)out.push(i);return out;}
  out.push(1);
  var s=Math.max(2,cur-1),e=Math.min(pages-1,cur+1);
  if(s>2)out.push("…");
  for(i=s;i<=e;i++)out.push(i);
  if(e<pages-1)out.push("…");
  out.push(pages);
  return out;
}

/* ---------- Dashboard：Aggregate → Exception → Priority → Drill-down ----------
   Dashboard 只讀 onHand()/reserved()/available()/incoming()，不建立任何庫存數字，
   也不 render 逐筆清單；資料量再大，這裡的版面與運算量都不變。 */
function daysLate(eta){return Math.round((new Date(d(0))-new Date(eta))/864e5);}
function dashboardMetrics(){
  var today=d(0);
  var openSO=DB.sos.filter(function(s){return s.status!=="已出貨"&&s.status!=="已結案";});
  var dueTodaySO=openSO.filter(function(s){return s.due===today;});
  var openPO=DB.pos.filter(function(p){return p.status!=="已入庫"&&p.status!=="已取消";});
  var latePO=openPO.filter(function(p){return p.eta<today;});
  var wipCV=DB.convs.filter(function(c){return c.status==="已釋放"||c.status==="進行中";});
  var openDN=DB.dns.filter(function(x){return x.status!=="已送達";});

  /* 庫存健康：互斥三態（正常／低庫存／缺貨）＋ 獨立輔助指標（補貨中） */
  var okN=0,lowItems=[],outItems=[],incN=0;
  DB.items.forEach(function(it){
    var av=available(it.code);
    if(av<=0)outItems.push(it);else if(av<it.safety)lowItems.push(it);else okN++;
    if(incoming(it.code)>0)incN++;
  });

  var shortages=shortageList().filter(function(r){return r.gap>0;});

  return {
    kpi:{openSO:openSO.length,dueToday:dueTodaySO.length,belowSafety:lowItems.length+outItems.length,
      openPO:openPO.length,wip:wipCV.length,openDN:openDN.length,shortage:shortages.length},
    health:{ok:okN,low:lowItems.length,out:outItems.length,inc:incN,total:DB.items.length},
    latePO:latePO,dueTodaySO:dueTodaySO,lowItems:lowItems,outItems:outItems,shortages:shortages
  };
}
/* Priority Top 3：採購逾期 → 今日應交未出貨 → 缺料未採購（連單都還沒下）→ 缺貨／低庫存（比例越低越優先） */
function dashboardTop3(m){
  var cand=[];
  m.latePO.slice().sort(function(a,b){return daysLate(b.eta)-daysLate(a.eta);}).forEach(function(po){
    cand.push({icon:'c',t:po.no,d:supName(po.sup)+'　已逾期 '+daysLate(po.eta)+' 天',view:'purchase',no:po.no});
  });
  m.dueTodaySO.slice().sort(function(a,b){return a.no<b.no?-1:1;}).forEach(function(so){
    cand.push({icon:'i',t:so.no,d:custName(so.cust)+'　今日應交',view:'sales',tab:'so',no:so.no});
  });
  m.shortages.slice().sort(function(a,b){return b.gap-a.gap;}).forEach(function(r){
    var it=item(r.item);
    cand.push({icon:'c',t:it.name,d:'缺口 '+q(r.gap)+' '+it.uom+'　尚未下採購單',view:'purchase',tab:'shortage'});
  });
  m.outItems.concat(m.lowItems).map(function(it){
    var av=available(it.code);
    return {it:it,av:av,ratio:it.safety>0?av/it.safety:(av<=0?-1:1)};
  }).sort(function(a,b){return a.ratio-b.ratio;}).forEach(function(x){
    cand.push({icon:(x.av<=0?'c':'w'),t:x.it.code,d:x.it.name+'　可用量 '+q(x.av)+' / 安全存量 '+x.it.safety,
      view:'inventory',tab:'stock',tblkey:'inv',q:x.it.code});
  });
  return cand.slice(0,3);
}

/* Sales Order = Control Tower：需求 → 承諾 → 供應配置 → 履約狀態 → 關聯單據 → 出貨 → 發票 */
function vOrders(){
  var so=findSO(S.so)||DB.sos[DB.sos.length-1];
  var fsRank={"待配置":0,"部分備齊":1,"已備齊":2,"部分出貨":3,"已出貨":4};
  var list='<div class="card"><h3>銷售訂單</h3>'+dataTable({
    key:"so",rows:DB.sos,placeholder:"搜尋單號、客戶、品項",
    search:function(s){return s.no+" "+custName(s.cust)+" "+s.lines.map(function(l){var it=item(l.item);return l.item+(it?it.name:"");}).join(" ");},
    filters:[
      {k:"status",label:"訂單狀態",options:["已確認","已配置","部分出貨","已出貨","已結案",["open","待履約中"]],match:function(r,v){
        if(v==="open")return r.status!=="已出貨"&&r.status!=="已結案";return r.status===v;}},
      {k:"fs",label:"履約狀態",options:["待配置","部分備齊","已備齊","部分出貨","已出貨"],match:function(r,v){return fulfillmentStatusOf(r).label===v;}},
      {k:"cust",label:"客戶",options:DB.customers.slice(0,40).map(function(c){return [c.code,c.name];}),match:function(r,v){return r.cust===v;}},
      {k:"due",label:"交期",options:[["today","今日應交"],["late","已逾期"],["future","未來"]],match:function(r,v){
        return v==="today"?r.due===d(0):(v==="late"?r.due<d(0):r.due>d(0));}},
      {k:"ff",label:"供應方式",options:[["裁切","含裁切"],["採購","含採購"],["現貨","純現貨"]],match:function(r,v){
        var has={現貨:false,裁切:false,採購:false},any=false;
        r.lines.forEach(function(l){if(!l.fulfill)return;any=true;
          if(l.fulfill.stock>0)has["現貨"]=true;if(l.fulfill.conversion>0)has["裁切"]=true;if(l.fulfill.purchase>0)has["採購"]=true;});
        if(!any)return false;
        return v==="現貨"?(has["現貨"]&&!has["裁切"]&&!has["採購"]):has[v];}}
    ],
    cols:[
      {k:"no",label:"銷售訂單",sort:function(r){return r.no;},cell:function(r){return '<span class="mono">'+r.no+'</span>';}},
      {k:"cust",label:"客戶",sort:function(r){return custName(r.cust);},cell:function(r){return esc(custName(r.cust));}},
      {k:"due",label:"要求交期",sort:function(r){return r.due;},cell:function(r){return '<span class="num">'+md(r.due)+'</span>';}},
      {k:"fs",label:"履約狀態",sort:function(r){return fsRank[fulfillmentStatusOf(r).label];},cell:function(r){return badge(fulfillmentStatusOf(r).label);}}
    ],
    defaultSort:function(rows){return rows.sort(function(a,b){return a.no<b.no?1:-1;});},
    onRow:function(r){return {act:"so",no:r.no,selected:so&&so.no===r.no};}
  })+'</div>';
  if(!so)return '<div class="split">'+list+'<div class="card"><div class="pad dim">尚無銷售訂單。請先於「報價單」頁籤建立報價並轉單。</div></div></div>';
  var c=cust(so.cust)||{contact:"",ship:"",terms:""};
  var total=so.lines.reduce(function(a,l){return a+l.qty*l.price;},0);
  var inv=invoiceOf(so.no);
  var dn=DB.dns.filter(function(x){return x.so===so.no;})[0];
  var fs=fulfillmentStatusOf(so),os=orderStatusOf(so);

  /* SO Line 確認前：整行改用即時試算預覽（可承諾數量／承諾交期／供應狀態／供應配置皆一致），
     只用淡色與「預覽」小字跟已確認的真實資料做區分，不讓同一行一半有資料一半是「—」。 */
  var rows=so.lines.map(function(l,li){
    var it=item(l.item),reqDate=l.requestedDate||so.due,confirmed=!!l.fulfill;
    var p=confirmed?null:planSupply(l.item,l.qty);
    var f=l.fulfill||(p?{stock:p.stock,conversion:p.conversion,purchase:p.purchase}:null);
    var confQty=confirmed?l.confirmedQty:(f?rnd3(f.stock+f.conversion+f.purchase):null);
    var confDate=confirmed?l.confirmedDate:(p?p.date:null);
    var st=promiseStatus(f,reqDate,confDate);
    var sq=salesQtyView(l),key=so.no+"|"+li,exp=!!S.expand[key];
    var preview=!confirmed?'<br><small class="dim" style="font-size:10px">預覽</small>':'';
    return '<tr><td>'+itemCell(l.item)+'</td>'+
      '<td>'+sq.html+'</td>'+
      '<td class="num">'+md(reqDate)+'</td>'+
      '<td class="r num'+(confirmed?'':' dim')+'">'+(confQty!==null?q(confQty)+' '+it.uom:'<span class="dim">—</span>')+'</td>'+

      '<td class="r"><button class="btn btn-sm" data-act="toggleexp" data-key="'+key+'">'+(exp?'收合':'查看履約明細')+'</button></td></tr>'+
      (exp&&f?'<tr><td colspan="9" style="padding:0">'+supplyDetailHTML(l.item,f,confDate,p?p.otherWh:rnd3(onHand(l.item)-onHand(l.item,FULFILL_WH)),confirmed)+'</td></tr>':'');
  }).join("");

  /* 供應建議面板（僅分析，尚未寫入任何資料）。
     系統算出來的現貨／裁切／採購配置只是預設建議，不是唯一解——「手動調整」讓人可以直接覆寫
     每一行的三個數量，系統即時重算承諾日期與履約狀態；確認供應方案時一律採用當下（可能已手動調整過）的數字。 */
  var rec='';
  if(so.status==="已確認"&&so.plan){
    var editing=S.planEdit===so.no;
    var prows=so.plan.map(function(p){
      var it=item(p.item),l=so.lines.filter(function(x){return x.id===p.lineId;})[0];
      var reqDate=l?(l.requestedDate||so.due):so.due;
      var st=promiseStatus({stock:p.stock,conversion:p.conversion,purchase:p.purchase},reqDate,p.date);
      return '<tr><td>'+itemCell(p.item)+'</td>'+
        '<td class="r num">'+q(p.qty)+' <span class="dim">'+it.uom+'</span></td>'+
        '<td class="num">'+md(reqDate)+'</td>'+
        '<td class="r num">'+q(p.stock+p.conversion+p.purchase)+' <span class="dim">'+it.uom+'</span></td>'+
        '<td class="num">'+p.date+'</td>'+

        '<span class="note">確認後才會依目前面板上的數字建立庫存保留、裁切工單與採購單（含手動調整過的數字）。目前尚未寫入任何資料。</span></div>'+

  var acts='';
  if(so.status==="已確認"){

      ?'<span class="note">供應建議已產生，請於下方面板確認或取消。</span>'

  }else if(so.status==="已配置"){
    acts=(dn?'<button class="btn" data-act="go" data-view="delivery" data-no="'+dn.no+'">查看出貨單 '+dn.no+'</button>':
      '<button class="btn btn-primary" data-act="mkdn" data-no="'+so.no+'"'+(fs.label==="已備齊"?'':' disabled')+'>建立出貨單</button>')+
      '<span class="note">'+(fs.label==="已備齊"?'所有明細皆已保留足量，可安排出貨。':'尚有明細未保留足量，需先完成裁切或採購收貨。')+
      ' 目前以整單備齊後才建立出貨單，是否允許分批出貨待需求確認。</span>';
  }else acts='<span class="note">此訂單已出貨完畢。</span>';

  /* 發票：出庫後人工建立 */
  var invBar='';
  if(inv){
    invBar='<div class="actbar"><span class="bdg g">發票已開立</span><button class="doc" data-act="chain" data-no="'+so.no+'">'+inv.no+'</button>'+
      '<span class="note">未稅 '+money(inv.sub)+'　稅額 '+money(inv.tax)+'　<b>總計 '+money(inv.total)+'</b></span></div>';
  }else if(so.status==="已出貨"){
    invBar='<div class="actbar"><span class="bdg w">可開立發票</span>'+
      '<button class="btn btn-primary" data-act="mkinv" data-no="'+so.no+'">建立銷貨發票</button>'+
      '<span class="note">發票實際開立時點待客戶確認。</span></div>';
  }

  /* 關聯單據：這張訂單實際「已經產生」的下游文件，逐列列出、各自可 Drill-down。
     跟「單據追溯」的差別：這裡是常駐在頁面上的快速總覽，單據追溯是含庫存總帳明細的完整鏈狀圖。 */
  var allConv=[],allPO=[];
  so.lines.forEach(function(l){
    if(l.conv&&allConv.indexOf(l.conv)<0)allConv.push(l.conv);
    if(l.po&&allPO.indexOf(l.po)<0)allPO.push(l.po);
  });
  var resvCount=DB.reservations.filter(function(r){return r.so===so.no;}).length;
  function docBtns(arr,view,emptyLabel){
    return arr.length?arr.map(function(no){return '<button class="doc" data-act="go" data-view="'+view+'" data-no="'+no+'">'+no+'</button>';}).join(""):badge(emptyLabel);
  }
  var notConfigured=so.status==="已確認"&&!so.lines.some(function(l){return l.fulfill;});
  var docRow=function(lb,val){return '<div class="docrow"><span class="lb">'+lb+'</span><span class="val">'+val+'</span></div>';};
  var related='<div class="card" style="margin-top:14px"><h3>關聯單據</h3>'+
    (notConfigured?'<div class="hnote" style="border-top:none;border-bottom:1px dashed var(--line)">供應方案尚未確認，以下單據要等「確認供應方案」後才會產生。</div>':'')+
    '<div class="doclist">'+
      docRow("報價來源",so.qt?'<button class="doc" data-act="go" data-view="sales" data-no="'+so.qt+'" data-tab="qt">'+so.qt+'</button>':badge("直接下單"))+
      docRow("庫存保留",resvCount?('<b class="num">'+resvCount+'</b> 筆'):badge("尚無保留"))+
      docRow("裁切工單",docBtns(allConv,"conversion","尚無裁切工單"))+
      docRow("採購單",docBtns(allPO,"purchase","尚無採購單"))+
      docRow("出貨單",dn?'<button class="doc" data-act="go" data-view="delivery" data-no="'+dn.no+'">'+dn.no+'</button>':badge("尚無出貨單"))+
      docRow("發票",inv?'<button class="doc" data-act="chain" data-no="'+so.no+'">'+inv.no+'</button>':badge("尚未開立"))+
    '</div></div>';

  var detail='<div class="card"><h3>'+so.no+'　'+custName(so.cust)+'<span class="sp"></span>'+badge(os.label)+badge(fs.label)+
      '<button class="btn btn-sm" data-act="chain" data-no="'+so.no+'">單據追溯</button></h3>'+
    '<div class="pad"><div class="dl">'+
      dt("客戶","<b>"+custName(so.cust)+"</b>　"+c.contact)+dt("交貨地址",c.ship)+dt("付款條件",c.terms)+
      dt("下單日期",'<span class="num">'+so.date+'</span>')+dt("要求交期",'<span class="num">'+so.due+'</span>')+
      dt("訂單金額",'<span class="num">'+money(total)+'</span>')+
      dt("來源報價",so.qt?'<button class="doc" data-act="go" data-view="sales" data-no="'+so.qt+'" data-tab="qt">'+so.qt+'</button>':'<span class="dim">直接下單</span>')+
      dt("發票狀態",inv?'<span class="bdg g">'+inv.no+'</span>':(so.status==="已出貨"?'<span class="bdg w">可開立發票</span>':'<span class="dim">尚未開立</span>'))+
    '</div></div>'+
    '<div class="tw"><table class="tbl"><thead><tr><th>品項</th><th>客戶需求</th><th>要求交期</th><th class="r">可承諾數量</th>'+
      '<th>承諾交期</th><th>履約狀態</th><th>供應配置</th><th class="r">小計</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="actbar">'+acts+'</div>'+invBar+
  '</div>';

  /* 右欄整組包成一個容器，作為 .split 的第二個 Grid 子項；
     供應建議／Related Documents／關聯流程都疊在同一欄內，不會因為子元素數量超過
     Grid 欄數而被自動排到左欄清單下方（先前的 bug）。 */
  var rightCol='<div>'+detail+rec+related+fulfillFlow(so,dn,fs)+'</div>';
  return '<div class="split">'+list+rightCol+'</div>';
}
function dt(l,v){return '<div><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
/* 麵包屑：純視覺導覽列，split-view 版面沒有獨立的「純列表頁」可回，因此不做假的可點擊語意。 */
function crumb(parts){
  return '<div class="crumb">'+parts.map(function(p,i){
    return (i?'<span class="sep">/</span>':'')+(i===parts.length-1?'<span class="cur">':'<span>')+esc(p)+'</span>';
  }).join("")+'</div>';
}
/* 關聯流程：SO 備齊 → 建立出貨單 → 出貨作業 → 出貨完成，對應實際狀態機，不是裝飾用假圖。 */
function fulfillFlow(so,dn,fs){
  var stages=[
    {label:"訂單備齊",done:fs.label==="已備齊"||fs.label==="部分出貨"||fs.label==="已出貨"},
    {label:"建立出貨單",done:!!dn},
    {label:"出貨作業",done:!!dn&&dn.status!=="待揀貨"},
    {label:"出貨完成",done:!!dn&&dn.status==="已送達"}
  ];
  var now=stages.length;
  for(var i=0;i<stages.length;i++){if(!stages[i].done){now=i;break;}}
  return '<div class="card" style="margin-top:14px"><h3>關聯流程</h3><div class="pad"><div class="steps">'+
    stages.map(function(s,i){
      var cls=s.done?"done":(i===now?"now":"");
      return '<span class="step '+cls+'" style="cursor:default"><span class="n">'+(s.done?"✓":(i+1))+'</span>'+s.label+'</span>'+
        (i<stages.length-1?'<span class="dim" style="margin:0 4px;align-self:center">→</span>':'');
    }).join("")+'</div></div></div>';
}
/* 報價單：編輯／複製／作廢 */

      requestedDate:l.requestedDate,price:l.price,list:l.list,custom:l.custom};})};

}
function duplicateQuote(no){

}
/* 新增／編輯報價共用同一個 Modal：有 S.editingQt 就更新既有報價，否則建立新報價。 */
function saveQuoteDraft(){
  if(!S.draft.lines.length)return;
  if(S.editingQt){
    var qt=findQT(S.editingQt);
    if(qt&&!qt.so){
      qt.cust=S.draft.cust;qt.due=S.draft.due;
      qt.lines=S.draft.lines.map(function(l){return {item:l.item,qty:l.qty,
        salesQty:l.salesQty,salesUom:l.salesUom,baseQty:l.baseQty,baseUom:l.baseUom,
        requestedDate:l.requestedDate,price:l.price,list:l.list,custom:l.custom};});
      DB.rev++;S.qt=qt.no;
      toast("報價單 "+qt.no+" 已更新。");
    }
    S.editingQt=null;S.draft={cust:S.draft.cust,due:d(4),lines:[]};
  }else createQuote();
}

/* ---- 採購 ----
   缺料建議（Buyer 視角）：只彙總「還沒走過供應方案確認」的訂單需求（l.fulfill 尚未寫入），
   扣掉目前可用庫存與在途採購量，算出真正還需要新下單的淨缺口。
   已經確認過供應方案的訂單，缺口早就反映在對應的自動採購單裡（算進在途），不重複列入，避免同一個缺口算兩次。
   來源限定「已核准（已轉訂單）」的訂單需求；安全存量式的預防性備貨是另一個題目，暫不併入。 */
function shortageList(){
  var demand={};
  DB.sos.forEach(function(so){
    /* 用訂單狀態（而非逐行 l.fulfill）判斷是否已核准供應方案：大量示範資料模式下，
       系統會先幫每一行塞一個全零的 fulfill 物件方便畫面渲染，若改用「有沒有 fulfill」
       來判斷，示範資料的需求會被誤判成「已處理」而整個消失，缺料建議就會顯示是空的
       （這正是目前這個 bug 的成因）。「已確認」這個狀態只會在客戶核准、尚未確認供應
       方案時出現，用它來判斷才精準、也對大量示範資料一樣成立。 */
    if(so.status!=="已確認")return;
    so.lines.forEach(function(l){
      demand[l.item]=rnd3((demand[l.item]||0)+l.qty);
    });
  });
  return Object.keys(demand).map(function(code){
    var av=Math.max(0,available(code,FULFILL_WH)),inc=incoming(code);
    var dem=demand[code],gap=rnd3(Math.max(0,dem-av-inc));
    return {item:code,demand:dem,avail:av,incoming:inc,gap:gap};
  }).sort(function(a,b){return b.gap-a.gap;});
}
/* 手動開單的預設值：從缺料建議帶入時給實際缺口量；自由新增時給一個跟安全存量成比例的參考量，
   純粹方便 Buyer 起手，數量／供應商／單價都還是可以直接改。 */
function defaultPODraft(itemCode,qty){
  var it=item(itemCode)||DB.items[0];
  var sup=supForItem(it.code)||DB.suppliers[0];
  return {item:it.code,sup:sup.code,qty:rnd3(qty!==undefined&&qty>0?qty:Math.max(1,it.safety*2)),
    cost:Math.round(it.price*0.86),eta:d(sup.days)};
}
/* 手動建立採購單：不綁定任何銷售訂單（so=""），純粹是 Buyer 自己判斷要買。
   跟 confirmSO() 自動開的單走同一個 PO 資料結構，收貨、在途計算、單據追溯都共用同一套邏輯。 */
function createManualPO(){
  var pd=S.poDraft; if(!pd||!pd.item||!pd.sup||!(pd.qty>0))return;
  var it=item(pd.item);
  var po={no:nextNo("po"),sup:pd.sup,date:d(0),eta:pd.eta||d(7),status:"已確認",so:"",soLine:null,
    lines:[{id:1,item:pd.item,qty:rnd3(pd.qty),recv:0,cost:Math.max(0,Math.round(pd.cost)||0)}]};
  DB.pos.push(po);DB.rev++;
  S.modal=null;S.poDraft=null;S.po=po.no;S.purchaseTab="po";
  toast("已手動建立採購單 "+po.no+"（"+supName(pd.sup)+"　"+q(rnd3(pd.qty))+" "+it.uom+"）。");
}
function vPurchase(){
  var tabs='<div class="tabs" role="tablist">'+
    [["po","採購訂單"],["shortage","缺料建議"]].map(function(t){
      return '<button class="tab" role="tab" aria-selected="'+(S.purchaseTab===t[0])+'" data-act="purtab" data-t="'+t[0]+'">'+t[1]+'</button>';
    }).join("")+'</div>';
  return '<div class="phead"><div><div class="eyebrow">採購管理</div><h1>採購與收貨</h1></div>'+
    '<div class="sub">已下單未入庫的數量計入「在途」，不計入現有量。</div>'+
    '<div style="flex-basis:100%;margin-top:2px">'+tabs+'</div></div>'+
    (S.purchaseTab==="shortage"?vShortage():vPOList());
}
/* 缺料建議清單：以品項為單位彙總，不是以訂單為單位——Buyer 要看的是「這個紙品到底還缺多少」，
   不是一張一張訂單去對。 */
function vShortage(){
  var rows=shortageList();
  var trs=rows.map(function(r){
    var it=item(r.item),sup=supForItem(r.item);
    return '<tr><td>'+itemCell(r.item)+'</td>'+
      '<td class="r num">'+q(r.demand)+' <span class="dim">'+it.uom+'</span></td>'+
      '<td class="r num">'+q(r.avail)+'</td>'+
      '<td class="r num">'+q(r.incoming)+'</td>'+
      '<td class="r num"><b>'+(r.gap>0?q(r.gap):'—')+'</b></td>'+
      '<td>'+(r.gap>0?badge("需採購"):badge("已足夠"))+'</td>'+
      '<td>'+esc(sup?sup.name:(it.mill||"—"))+'</td>'+
      '<td class="r">'+(r.gap>0?'<button class="btn btn-sm btn-primary" data-act="openpofromshort" data-item="'+r.item+'" data-qty="'+r.gap+'">開立採購單</button>':'<span class="dim">—</span>')+'</td></tr>';
  }).join("");
  if(!rows.length)trs='<tr><td colspan="8" class="dim" style="padding:18px 12px">目前沒有尚待確認供應方案的訂單需求。</td></tr>';
  return '<div class="card"><h3>缺料建議<span class="sp"></span><span class="dim" style="font-size:11px;font-weight:400">彙總尚未確認供應方案的訂單需求，扣掉現有可用庫存與在途採購後的淨缺口</span></h3>'+
    '<div class="tw"><table class="tbl"><thead><tr><th>品項</th><th class="r">訂單需求</th><th class="r">現有可用</th><th class="r">在途採購</th><th class="r">淨缺口</th><th>狀態</th><th>建議供應商</th><th></th></tr></thead><tbody>'+trs+'</tbody></table></div>'+

    key:"cv",rows:DB.convs,placeholder:"搜尋工單號、來源訂單、品項",
    search:function(c){var i1=item(c.inItem),i2=item(c.outItem);
      return c.no+" "+(c.so||"")+" "+c.inItem+" "+c.outItem+" "+(i1?i1.name:"")+" "+(i2?i2.name:"");},
    filters:[

/* ---- 主檔（全部可編輯：紙品／客戶／供應商／倉別；客戶專屬價格併入客戶明細） ----
   新增走 Modal（跟新增報價／新增採購單同一套介面語言）；既有資料直接在明細欄位編輯，
   change（欄位失焦或 Enter）就即時寫回，不用另外按「儲存」。刪除前一律檢查有沒有
   單據／庫存紀錄還參照著它，避免刪掉正在使用中的資料，讓畫面後面找不到對應資料而壞掉。 */
function applyMasterEdit(type,code,field,raw){
  var rec=type==="item"?item(code):type==="cust"?cust(code):type==="sup"?supp(code):type==="wh"?idx().wh[code]:null;
  if(!rec)return;
  var numFields={item:{gsm:1,kg:1,price:1,safety:1},sup:{days:1}};
  var val=(numFields[type]&&numFields[type][field])?Math.max(0,parseFloat(raw)||0):raw;
  rec[field]=val;
  if(type==="sup"&&field==="days")rec.lead=val+" 天"; /* .lead 是給人看的字串，.days 是算日期用的數字，改天數要連帶同步顯示字串 */
  DB.rev++;
}
function refsOfItem(code){
  var n=0;
  DB.quotes.forEach(function(x){x.lines.forEach(function(l){if(l.item===code)n++;});});
  DB.sos.forEach(function(x){x.lines.forEach(function(l){if(l.item===code)n++;});});
  DB.pos.forEach(function(x){x.lines.forEach(function(l){if(l.item===code)n++;});});
  DB.convs.forEach(function(x){if(x.inItem===code||x.outItem===code)n++;});
  DB.ledger.forEach(function(x){if(x.item===code)n++;});
  DB.rolls.forEach(function(x){if(x.item===code)n++;});
  DB.items.forEach(function(x){if(x.parent===code)n++;});
  DB.customers.forEach(function(x){if(x.prices&&x.prices[code]!==undefined)n++;});
  return n;
}
function refsOfCust(code){
  var n=0;
  DB.quotes.forEach(function(x){if(x.cust===code)n++;});
  DB.sos.forEach(function(x){if(x.cust===code)n++;});
  return n;
}
function refsOfSup(code){
  var s=supp(code); if(!s)return 0;
  var n=0;
  DB.pos.forEach(function(x){if(x.sup===code)n++;});
  DB.items.forEach(function(x){if(x.mill===s.name)n++;});
  return n;
}
function refsOfWh(code){
  var n=0;
  DB.ledger.forEach(function(x){if(x.wh===code)n++;});
  DB.rolls.forEach(function(x){if(x.wh===code)n++;});
  DB.reservations.forEach(function(x){if(x.wh===code)n++;});
  return n;
}
function deleteMaster(type,code,name){
  if(type==="wh"&&code===FULFILL_WH){toast("「"+FULFILL_WH_NAME+"」是目前設定的履約倉，銷售可承諾／保留／出貨都以它為準，不能刪除。");return false;}
  var refFn={item:refsOfItem,cust:refsOfCust,sup:refsOfSup,wh:refsOfWh}[type];
  var n=refFn(code);
  if(n>0){toast("無法刪除「"+name+"」：還有 "+n+" 筆單據或庫存紀錄參照著它，刪除會讓那些紀錄找不到對應資料。");return false;}
  var arr={item:"items",cust:"customers",sup:"suppliers",wh:"warehouses"}[type];
  DB[arr]=DB[arr].filter(function(x){return x.code!==code;});
  DB.rev++;
  toast("已刪除「"+name+"」。");
  return true;
}
function newDraft(type){
  if(type==="item")return {code:"",name:"",grade:"",form:"平張",spec:"",mill:DB.suppliers[0].name,gsm:80,kg:1,price:0,safety:0};
  if(type==="cust")return {code:"",name:"",contact:"",terms:"月結 30 天"};
  if(type==="sup")return {code:"",name:"",days:7,terms:"月結 30 天"};
  return {code:"",name:"",addr:""};
}
function commitNewMaster(type){
  var d=S.mDraft; if(!d)return false;
  var code=(d.code||"").trim();
  if(!code){toast("請先填代號／料號。");return false;}
  var arr={item:"items",cust:"customers",sup:"suppliers",wh:"warehouses"}[type];
  if(DB[arr].some(function(x){return x.code===code;})){toast("代號「"+code+"」已經存在，換一個。");return false;}
  if(!(d.name||"").trim()){toast("請填名稱。");return false;}
  var rec;
  if(type==="item"){
    var kgVal=Math.max(0.01,parseFloat(d.kg)||1);
    rec={code:code,name:d.name,grade:d.grade||"未分類",gsm:Math.max(0,parseFloat(d.gsm)||0),form:d.form||"平張",
      spec:d.spec||"",mill:d.mill||DB.suppliers[0].name,uom:"令",kg:kgVal,
      safety:Math.max(0,parseFloat(d.safety)||0),price:Math.max(0,parseFloat(d.price)||0),
      uoms:[["令",1],["張",500],["公斤",kgVal]]};
  }else if(type==="cust"){
    rec={code:code,name:d.name,contact:d.contact||"",terms:d.terms||"月結 30 天",prices:{}};
  }else if(type==="sup"){
    var days=Math.max(0,parseFloat(d.days)||7);
    rec={code:code,name:d.name,lead:days+" 天",days:days,terms:d.terms||"月結 30 天"};
  }else{
    rec={code:code,name:d.name,addr:d.addr||""};
  }
  DB[arr].push(rec);DB.rev++;
  S.modal=null;S.mDraft=null;S.mDraftType=null;
  if(type==="item")S.mIt=code;if(type==="cust")S.mCu=code;if(type==="sup")S.mSu=code;if(type==="wh")S.mWh=code;
  toast("已新增「"+d.name+"」。");
  return true;
}
function addCustPrice(custCode,itemCode,priceRaw){
  var c=cust(custCode); if(!c||!itemCode)return;
  if(!c.prices)c.prices={};
  c.prices[itemCode]=Math.max(0,parseFloat(priceRaw)||0);
  DB.rev++;
}
function delCustPrice(custCode,itemCode){
  var c=cust(custCode); if(!c||!c.prices)return;
  delete c.prices[itemCode];
  DB.rev++;
}

function openChain(soNo){
  var so=findSO(soNo);
  var inv=DB.invoices.filter(function(x){return x.so===soNo;})[0];
  var dn=DB.dns.filter(function(x){return x.so===soNo;})[0];
  var cvs=DB.convs.filter(function(x){return x.so===soNo;});
  var pos=DB.pos.filter(function(x){return x.so===soNo;});
  function node(cls,no,title,desc,view){
    return '<div class="node '+cls+'"><div class="h"><b>'+no+'</b>'+title+
      (view?'<span class="sp" style="flex:1"></span><button class="btn btn-sm" data-act="go" data-view="'+view+'" data-no="'+no+'">開啟</button>':'')+
      '</div><div class="d">'+desc+'</div></div>';
  }
  var mid='';
  so.lines.forEach(function(l){
    var it=item(l.item);
    if(l.conv){
      var cv=findCV(l.conv);
      mid+=node("k",cv.no,'<span class="bdg k">裁切工單</span>',
        '投入 '+cv.inQty+' 捲（'+esc(cv.rolls.join("、"))+'）→ 產出 '+cv.outQty+' 令 '+it.name+'，剩料 '+n0(cv.remainKg)+' kg'+(cv.remainRoll?'（'+cv.remainRoll+'）':'')+'，損耗 '+n1(cv.scrapKg)+' kg，良率 '+n1(cv.yield)+'%',"conversion")+'<div class="link"></div>';
    }
    if(l.po){
      var po=findPO(l.po);
      mid+=node("i",po.no,'<span class="bdg i">採購單</span>',
        supName(po.sup)+'　'+po.lines[0].qty+' '+it.uom+' '+it.name+'　'+(po.status==="已入庫"?"已驗收入庫":"待收貨"),"purchase")+'<div class="link"></div>';
    }
  });
  var resv=DB.reservations.filter(function(r){return r.so===soNo;});
  var qt=so.qt?findQT(so.qt):null;
  var body='<div class="chain">'+
    (qt?node("n",qt.no,'<span class="bdg n">報價單</span>',
      custName(qt.cust)+'　報價日 '+qt.date+'　有效期至 '+qt.valid+'　合計 '+money(qt.lines.reduce(function(a,l){return a+l.qty*l.price;},0))+'（未稅）',"")+'<div class="link"></div>':'')+
    node("a",so.no,'<span class="bdg a">銷售訂單</span>',custName(so.cust)+'　'+so.lines.length+' 個明細　交期 '+so.due,"sales")+
    '<div class="link"></div>'+
    '<div class="branch">'+
      node("n","保留 "+resv.length+" 筆",'<span class="bdg n">庫存保留</span>',
        resv.map(function(r){return item(r.item).name+' '+q(r.qty)+' '+item(r.item).uom+'（'+(r.status==="consumed"?"已出庫":"保留中")+'）';}).join("；")||"—","")+
      '<div class="link"></div>'+mid+
    '</div>'+
    (dn?node("g",dn.no,'<span class="bdg g">出貨單</span>',dn.status+'　'+dn.lines.length+' 個明細　'+custName(dn.cust)+(dn.posted?'　庫存已過帳':'　庫存尚未過帳'),"delivery")+'<div class="link"></div>':'')+
    (inv?node("g",inv.no,'<span class="bdg g">銷貨發票</span>','未稅 '+money(inv.sub)+'　稅額 '+money(inv.tax)+'　總計 <b>'+money(inv.total)+'</b>',"")
        :node("n","發票",'<span class="bdg n">銷貨發票</span>',so.status==="已出貨"?'尚未開立 —— 可於銷售訂單頁按「建立銷貨發票」開立。':'尚未開立 —— 需先完成出貨。',""))+
  '</div>';
  var ledgerRows=DB.ledger.filter(function(l){
    return l.ref===so.no||(dn&&l.ref===dn.no)||cvs.some(function(c){return c.ref===l.ref||c.no===l.ref;})||pos.some(function(p){return p.no===l.ref;});
  });
  var lg=ledgerRows.length?'<h3 style="font-size:13px;margin:18px 0 8px">這條單據鏈產生的庫存異動（'+ledgerRows.length+' 筆）</h3>'+
    '<div class="tw"><table class="tbl" style="border:1px solid var(--line);border-radius:4px">'+
    '<thead><tr><th>異動</th><th>事件</th><th>品項</th><th>倉別</th><th class="r">數量</th><th>來源</th></tr></thead><tbody>'+
    ledgerRows.map(function(l){
      return '<tr><td class="mono dim">'+l.id+'</td><td>'+l.event+'</td><td><span class="mono" style="font-size:12px">'+l.item+'</span></td>'+
        '<td>'+whName(l.wh)+'</td><td class="r num" style="color:'+(l.qty>0?"var(--good)":"var(--crit)")+'">'+(l.qty>0?"+":"")+q(l.qty)+'</td>'+
        '<td class="mono" style="font-size:12px">'+l.ref+'</td></tr>';
    }).join("")+'</tbody></table></div>':'<p class="dim" style="margin-top:16px">此訂單尚未產生庫存異動。</p>';

  el("modal").innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="單據追溯">'+
    '<header><h2>單據追溯　'+so.no+'</h2><div style="flex:1"></div><button class="btn btn-sm" data-act="closemodal">關閉</button></header>'+
    '<div class="pad">'+body+lg+'</div></div>';
  el("modal").hidden=false;
}

var VIEWS={dash:vDash,sales:vSales,purchase:vPurchase,inventory:vInventory,conversion:vConversion,delivery:vDelivery,master:vMaster};
function counts(v){
  var n=0;
  if(v==="sales")n=DB.quotes.filter(function(x){return !x.so;}).length+DB.sos.filter(function(s){return s.status!=="已出貨"&&s.status!=="已結案";}).length;
  else if(v==="purchase")n=DB.pos.filter(function(p){return p.status!=="已入庫";}).length+shortageList().filter(function(r){return r.gap>0;}).length;
  else if(v==="conversion")n=DB.convs.filter(function(c){return c.status!=="已完成";}).length;
  else if(v==="delivery")n=DB.dns.filter(function(x){return x.status!=="已送達";}).length;
  return n?n0(n):"";
}

/* ====================== 事件 ====================== */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b)return;
  var a=b.dataset.act,no=b.dataset.no;
  if(a==="nav"){S.view=b.dataset.view;render();return;}
  if(a==="go"){
    S.view=b.dataset.view;
    if(no){
      if(S.view==="sales"){
        if(b.dataset.tab==="qt"||no.indexOf("QT-")===0){S.salesTab="qt";S.qt=no;}
        else {S.salesTab="so";S.so=no;}
      }
      if(S.view==="purchase")S.po=no;if(S.view==="conversion")S.cv=no;if(S.view==="delivery")S.dn=no;
    }
    S.modal=null;el("modal").hidden=true;render();return;
  }
  if(a==="dashgo"){
    S.modal=null;
    S.view=b.dataset.view;
    if(b.dataset.tab){if(S.view==="sales")S.salesTab=b.dataset.tab;if(S.view==="inventory")S.invTab=b.dataset.tab;if(S.view==="purchase")S.purchaseTab=b.dataset.tab;}
    if(no){if(S.view==="sales")S.so=no;if(S.view==="purchase")S.po=no;if(S.view==="conversion")S.cv=no;if(S.view==="delivery")S.dn=no;}
    var tk=b.dataset.tblkey;
    if(tk){
      var st=tbl(tk);st.page=1;
      if(b.dataset.filters){var fl=JSON.parse(b.dataset.filters);for(var k in fl)if(fl.hasOwnProperty(k))st.f[k]=fl[k];}
      if(b.dataset.q!==undefined)st.q=b.dataset.q;
    }
    el("modal").hidden=true;render();return;
  }
  if(a==="salestab"){S.salesTab=b.dataset.t;render();return;}
  if(a==="qtdtab"){S.qtDetailTab=b.dataset.t;render();return;}
  if(a==="qt"){S.qt=no;render();return;}
  if(a==="so"){S.so=no;render();return;}
  if(a==="po"){S.po=no;render();return;}
  if(a==="cv"){S.cv=no;render();return;}
  if(a==="dn"){S.dn=no;render();return;}
  if(a==="invtab"){S.invTab=b.dataset.t;render();return;}
  if(a==="purtab"){S.purchaseTab=b.dataset.t;render();return;}
  if(a==="opencreatepo"){S.poDraft=defaultPODraft(DB.items[0].code);S.modal="createpo";render();el("modal").hidden=false;return;}
  if(a==="openpofromshort"){S.poDraft=defaultPODraft(b.dataset.item,parseFloat(b.dataset.qty)||0);S.modal="createpo";render();el("modal").hidden=false;return;}
  if(a==="mkpo"){createManualPO();el("modal").hidden=true;render();return;}
  if(a==="mastertab"){S.masterTab=b.dataset.t;render();return;}
  if(a==="mit"){S.mIt=no;render();return;}
  if(a==="mcu"){S.mCu=no;render();return;}
  if(a==="msu"){S.mSu=no;render();return;}
  if(a==="mwh"){S.mWh=no;render();return;}
  if(a==="opennewmaster"){var mtOpen=b.dataset.t;S.mDraft=newDraft(mtOpen);S.mDraftType=mtOpen;S.modal="newmaster";render();el("modal").hidden=false;return;}
  if(a==="mknewmaster"){if(commitNewMaster(S.mDraftType))el("modal").hidden=true;render();return;}
  if(a==="delmaster"){
    var mtDel=b.dataset.t,codeDel=no;
    var recDel=mtDel==="item"?item(codeDel):mtDel==="cust"?cust(codeDel):mtDel==="sup"?supp(codeDel):idx().wh[codeDel];
    if(deleteMaster(mtDel,codeDel,recDel?recDel.name:codeDel)){
      if(mtDel==="item"&&S.mIt===codeDel)S.mIt=null;
      if(mtDel==="cust"&&S.mCu===codeDel)S.mCu=null;
      if(mtDel==="sup"&&S.mSu===codeDel)S.mSu=null;
      if(mtDel==="wh"&&S.mWh===codeDel)S.mWh=null;
    }
    render();return;
  }
  if(a==="addcustprice"){
    var cpIt=el("cp-item"),cpPr=el("cp-price");
    if(cpIt&&cpPr)addCustPrice(b.dataset.cust,cpIt.value,cpPr.value);
    render();return;
  }
  if(a==="delcustprice"){delCustPrice(b.dataset.cust,b.dataset.item);render();return;}
  if(a==="addline"){
    S.draft.cust=el("f-cust").value;S.draft.due=el("f-due").value||S.draft.due;
    var okAdd=addDraftLine(el("f-item").value,parseFloat(el("f-qty").value)||0,el("f-uom").value);
    if(!okAdd)toast("請先輸入大於 0 的數量。");
    render();return;
  }
  if(a==="delline"){S.draft.lines.splice(+b.dataset.i,1);render();return;}
  if(a==="prefill"){
    S.draft.cust="C-101";S.draft.due=d(4);S.draft.lines=[];
    addDraftLine("SH-DL80-787",120,"令");addDraftLine("SH-ART157-788",60,"令");addDraftLine("RL-KR120-1200",8,"捲");
    render();toast("已帶入宏泰印刷的三個示範品項，可直接產生報價單，也可以自行增減。");return;
  }
  if(a==="opencreateqt"){S.editingQt=null;S.draft={cust:S.draft.cust||"C-101",due:d(4),lines:[]};S.modal="createqt";render();el("modal").hidden=false;return;}
  if(a==="editqt"){editQuote(no);render();el("modal").hidden=false;return;}
  if(a==="dupqt"){duplicateQuote(no);render();return;}
  if(a==="voidqt"){voidQuote(no);render();return;}
  if(a==="toggleexp"){S.expand[b.dataset.key]=!S.expand[b.dataset.key];render();return;}
  if(a==="mkquote"){saveQuoteDraft();S.modal=null;el("modal").hidden=true;render();return;}
  if(a==="convq"){convertQuote(no);render();return;}
  if(a==="postcount"){S.flash=[];S.reason=el("f-reason").value;postCount();render();return;}
  if(a==="recplan"){recommendSO(no);S.planEdit=null;render();return;}
  if(a==="recplanmanual"){recommendSO(no);S.planEdit=no;render();return;}
  if(a==="confirmplan"){S.flash=[];confirmSO(no);S.planEdit=null;render();return;}
  if(a==="cancelplan"){cancelPlan(no);S.planEdit=null;render();return;}
  if(a==="toggleplanedit"){S.planEdit=S.planEdit===no?null:no;render();return;}
  if(a==="mkinv"){createInvoice(no);S.view="sales";S.salesTab="so";S.so=no;render();return;}
  if(a==="runcv"){S.flash=[];runConversion(no);S.cv=no;render();return;}
  if(a==="recv"){S.flash=[];receivePO(no);S.po=no;render();return;}
  if(a==="mkdn"){var newdn=createDN(no);S.dn=newdn.no;toast("出貨單 "+newdn.no+" 已建立，狀態：待揀貨。要開始處理可按下方「查看出貨單」。");render();return;}
  if(a==="advdn"){S.flash=[];advanceDN(no);S.dn=no;render();return;}
  if(a==="chain"){S.modal=null;openChain(no);return;}
  if(a==="closemodal"){el("modal").hidden=true;S.modal=null;return;}
  if(a==="closetoast"){el("toast").hidden=true;return;}
  if(a==="goledger"){S.view="inventory";S.invTab="ledger";el("toast").hidden=true;render();return;}
  if(a==="theme"){
    var r=document.documentElement;
    var dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-theme",dark?"light":"dark");return;
  }
  if(a==="reset"){DB=buildDB();S=initState();el("modal").hidden=true;el("toast").hidden=true;render();return;}
});
/* 表格互動：搜尋、篩選、排序、翻頁、每頁筆數 */
document.addEventListener("click",function(e){
  var th=e.target.closest("[data-ts]"),pb=e.target.closest("[data-tp]");
  if(th){
    var ps=th.dataset.ts.split("|"),st=tbl(ps[0]);
    if(st.sort===ps[1])st.dir=st.dir==="asc"?"desc":"asc";
    else {st.sort=ps[1];st.dir="asc";}
    render();return;
  }
  if(pb&&!pb.disabled){
    var pp=pb.dataset.tp.split("|"),s2=tbl(pp[0]);
    s2.page=Math.max(1,parseInt(pp[1],10)||1);
    render();return;
  }
});
/* 表單即時反應：只重算試算區塊，不重繪整頁 */
function onFormChange(e){
  var t=e.target;
  /* 表格工具列 */
  if(t.hasAttribute&&t.hasAttribute("data-tq")){
    var st=tbl(t.dataset.tq);st.q=t.value;st.page=1;
    S.focusSel='[data-tq="'+t.dataset.tq+'"]';
    render();return;
  }
  if(t.hasAttribute&&t.hasAttribute("data-tf")){
    var fp=t.dataset.tf.split("|"),s2=tbl(fp[0]);
    s2.f[fp[1]]=t.value;s2.page=1;render();return;
  }
  if(t.hasAttribute&&t.hasAttribute("data-tz")){
    var s3=tbl(t.dataset.tz);s3.size=parseInt(t.value,10)||DEFAULT_PAGE_SIZE;s3.page=1;render();return;
  }
  /* 供應建議手動調整：現貨／裁切／採購三個數量欄位改了之後，即時重算承諾日期與履約狀態。
     只在 change（欄位失焦或按 Enter）才處理，避免每打一個字就整頁重繪，把小數點打斷。 */
  if(e.type==="change"&&t.hasAttribute&&t.hasAttribute("data-planqty")){
    var pq=t.dataset.planqty.split("|");
    if(applyPlanEdit(pq[0],parseInt(pq[1],10),pq[2],t.value)){
      S.focusSel='[data-planqty="'+t.dataset.planqty+'"]';
      render();return;
    }
  }
  /* 主檔明細編輯：跟供應建議手動調整一樣，只在 change 才處理，避免每打一個字整頁重繪。 */
  if(e.type==="change"&&t.hasAttribute&&t.hasAttribute("data-medit")){
    var mp=t.dataset.medit.split("|");
    applyMasterEdit(mp[0],mp[1],mp[2],t.value);
    S.focusSel='[data-medit="'+t.dataset.medit+'"]';
    render();return;
  }
  /* 新增主檔資料 Modal 的草稿欄位：純粹先存到 S.mDraft，按「建立」才真正寫入 DB，
     不需要重繪（沒有任何欄位會因為別的欄位改變而跟著變），也就不會有打字被打斷的問題。 */
  if(t.hasAttribute&&t.hasAttribute("data-nedit")){
    if(S.mDraft)S.mDraft[t.dataset.nedit]=t.value;
    return;
  }
  if(t.id==="dsmode"){
    LARGE_DATASET_MODE=(t.value==="big");
    DB=buildDB();S=initState();
    toast(LARGE_DATASET_MODE
      ?"已切換為大量資料模式："+n0(DB.items.length)+" 個品項、"+n0(DB.customers.length)+" 家客戶、"+n0(DB.sos.length)+" 張銷售單、"+n0(DB.ledger.length)+" 筆庫存異動。表格一律以搜尋、篩選、排序與分頁取用。"
      :"已切回標準示範資料。");
    render();return;
  }
  if(!t.id&&!t.dataset.cnt)return;
  if(t.id==="f-item"){
    var it=item(t.value),sel=el("f-uom");
    sel.innerHTML=it.uoms.map(function(u){return '<option value="'+u[0]+'">'+u[0]+'</option>';}).join("");
    updateQuoteCalc();return;
  }
  if(t.id==="f-cust"){
    S.draft.cust=t.value;
    S.draft.lines.forEach(function(l){var p=priceFor(t.value,l.item);l.price=p.price;l.list=p.list;l.custom=p.custom;});
    if(S.draft.lines.length){render();return;}
    updateQuoteCalc();return;
  }
  if(t.id==="f-qty"||t.id==="f-uom"){updateQuoteCalc();return;}
  if(t.id==="f-due"){S.draft.due=t.value;return;}
  if(t.id==="f-reason"){S.reason=t.value;return;}
  if(t.id==="f-qtnote"){var qtN=findQT(S.qt);if(qtN){qtN.note=t.value;DB.rev++;}return;}
  /* 新增採購單 Modal：換品項時保留使用者已輸入的數量，只重新帶入該品項的預設供應商／單價／交期；
     換供應商時只重算交期。數量／單價／到貨日只在 change（失焦或 Enter）才處理，理由跟供應建議
     手動調整欄位一樣：避免每打一個字就整頁重繪，把小數點或日期輸入打斷。 */
  if(t.id==="pf-item"){S.poDraft=defaultPODraft(t.value,S.poDraft?S.poDraft.qty:undefined);render();return;}
  if(t.id==="pf-sup"){
    if(S.poDraft){var spx=supp(t.value);S.poDraft.sup=t.value;S.poDraft.eta=d(spx?spx.days:7);}
    render();return;
  }
  if(e.type==="change"&&(t.id==="pf-qty"||t.id==="pf-cost"||t.id==="pf-eta")){
    if(S.poDraft){
      if(t.id==="pf-qty")S.poDraft.qty=Math.max(0,parseFloat(t.value)||0);
      if(t.id==="pf-cost")S.poDraft.cost=Math.max(0,parseFloat(t.value)||0);
      if(t.id==="pf-eta")S.poDraft.eta=t.value||S.poDraft.eta;
    }
    render();return;
  }
  if(t.dataset.cnt){
    var k=t.dataset.cnt;S.count[k]=t.value;
    var parts=k.split("|"),book=onHand(parts[0],parts[1]);
    var diff=Math.round(((parseFloat(t.value)||0)-book)*1000)/1000;
    var cell=el("diff-"+parts[0]+"-"+parts[1]);
    if(cell){cell.textContent=(diff>0?"+":"")+q(diff);
      cell.style.color=diff?(diff>0?"var(--good)":"var(--crit)"):"var(--ink-3)";}
  }
}
document.addEventListener("input",onFormChange);
document.addEventListener("change",onFormChange);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){el("modal").hidden=true;S.modal=null;el("toast").hidden=true;}
});
el("modal").addEventListener("click",function(e){if(e.target===el("modal")){el("modal").hidden=true;S.modal=null;}});
render();
</script>
